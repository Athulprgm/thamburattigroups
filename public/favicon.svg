  <line x1="17" y1="36" x2="20" y2="29" stroke="#090A0D" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="36" x2="25" y2="26" stroke="#090A0D" stroke-width="2" stroke-linecap="round"/>
  <line x1="27" y1="36" x2="30" y2="23" stroke="#090A0D" stroke-width="2" stroke-linecap="round"/>

  <!-- Tipper Lift Hydraulic Ram -->
  <line x1="30" y1="37.5" x2="33" y2="30" stroke="#71717A" stroke-width="2"/>

  <!-- Truck Cab (White Body with Black Window and Grille) -->
  <path d="M34 43V27.5L44 28.5L48 34L49 43H34Z" fill="#FFFFFF"/>
  <!-- Windshield -->
  <path d="M39 29.5L43.5 30.5L46.5 35H39V29.5Z" fill="#090A0D"/>
  <!-- Front Bumper / Grille -->
  <path d="M44 38H49V43H44V38Z" fill="#18181B"/>
  <circle cx="47" cy="41" r="1" fill="#F59E0B"/>

  <!-- Chassis & Wheels -->
  <path d="M13 43H50V45H13V43Z" fill="#27272A"/>

  <!-- Wheels -->
  <!-- Rear Wheels -->
  <circle cx="18" cy="45" r="4.5" fill="#18181B" stroke="#F4F4F5" stroke-width="1"/>
  <circle cx="18" cy="45" r="1.5" fill="#71717A"/>
  
  <circle cx="27" cy="45" r="4.5" fill="#18181B" stroke="#F4F4F5" stroke-width="1"/>
  <circle cx="27" cy="45" r="1.5" fill="#71717A"/>

  <!-- Front Wheel -->
  <circle cx="42" cy="45" r="4.5" fill="#18181B" stroke="#F4F4F5" stroke-width="1"/>
  <circle cx="42" cy="45" r="1.5" fill="#71717A"/>
