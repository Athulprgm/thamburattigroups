<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Obsidian Base with Rounded Corners -->
  <rect width="64" height="64" rx="14" fill="#090A0D"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Speed Lines / Ground -->
  <path d="M7 47H57" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- Raised Tipper Bed (Orange with Slanted Stripes) -->
  <path d="M12 37.5L34 19L36.5 21.5L33.5 37.5L12 37.5Z" fill="#F97316"/>
  <path d="M34 19L38.5 20L34 29L31 29L34 19Z" fill="#EA580C"/>
